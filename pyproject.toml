[project]
name = "mpcdset"
version = "0.1.0"
description = "Paired-sample (input/target field) dataset storage on Zarr v3, with a stable reader API across on-disk format versions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zarr>=3.0",
    "numcodecs>=0.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpcdset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
